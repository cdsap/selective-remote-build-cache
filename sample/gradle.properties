# Knobs for the selective remote cache demo, read with providers.gradleProperty in
# settings.gradle.kts. Override any of them on the command line, e.g.
#
#   ../gradlew runAll --build-cache -PselectiveCache.maxStoreSizeBytes=100000
#
# Gradle properties are proper configuration-cache inputs: changing one invalidates the entry
# instead of silently reusing a stale configuration. (System properties passed with -D are not
# equivalent here - they attach to the daemon JVM for its whole lifetime and leak between runs.)

# Types that must never use the REMOTE cache. Comma-separated, '*' wildcards allowed.
selectiveCache.excludedTypes=com.android.build.gradle.internal.tasks.DexMergingTask

# Skip remote stores above this many bytes. 0 = no limit.
selectiveCache.maxStoreSizeBytes=0

# Turn the local cache tier off, to force the remote to be consulted.
selectiveCache.localEnabled=true
