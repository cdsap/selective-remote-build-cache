name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # One JDK failing says something specific about that JDK; the others should still report.
      fail-fast: false
      matrix:
        # 17 is the floor — the oldest JDK a Gradle 9 daemon runs on, and what the plugin's
        # bytecode targets. The functional tests spawn their TestKit builds on this same JDK, so
        # each leg proves the plugin is usable there rather than merely that it compiles.
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is an executable binary in the repo; confirm it is an
      # untampered official distribution before we run it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Pins the toolchain the same way the wrapper pins Gradle: if ./gradlew
      # ever resolves to something other than 9.7.1, fail loudly rather than
      # silently validating the wrong version.
      - name: Confirm pinned Gradle version
        run: |
          ACTUAL="$(./gradlew -p plugin --version | awk '/^Gradle/ {print $2}')"
          echo "Gradle reported: $ACTUAL"
          [ "$ACTUAL" = "9.7.1" ] || { echo "::error::expected Gradle 9.7.1, got $ACTUAL"; exit 1; }

      - name: Build and test the plugin
        run: ./gradlew -p plugin build --stacktrace

      # The point of pinning the target in plugin/build.gradle.kts: the artifact must resolve for
      # a consumer on Java 17 no matter which JDK cut the release. Both facts are checked, because
      # the metadata attribute is what fails resolution and the bytecode is what fails at class
      # load. Without this, building on a newer JDK silently raises the floor for everyone.
      - name: Confirm the artifact still targets Java 17
        run: |
          ./gradlew -p plugin generateMetadataFileForPluginMavenPublication -q

          JAR="$(find plugin/build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          PROBE="${RUNNER_TEMP:-/tmp}/probe.class"
          unzip -p "$JAR" io/github/cdsap/selectivecache/SelectiveRemoteBuildCache.class > "$PROBE"
          MAJOR="$(javap -v "$PROBE" | awk '/major version/ {print $3}')"
          echo "bytecode major version: $MAJOR"
          [ "$MAJOR" = "61" ] || { echo "::error::expected Java 17 bytecode (major 61), got $MAJOR"; exit 1; }

          META=plugin/build/publications/pluginMaven/module.json
          JVM="$(grep -o '\"org.gradle.jvm.version\": *[0-9]*' "$META" | head -1 | grep -o '[0-9]*$')"
          echo "org.gradle.jvm.version: $JVM"
          [ "$JVM" = "17" ] || { echo "::error::module metadata declares Java $JVM, expected 17"; exit 1; }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Artifact names have to be unique across the matrix.
          name: test-reports-jdk${{ matrix.java }}
          path: |
            plugin/build/reports/tests/
            plugin/build/test-results/
          retention-days: 7

  android:
    name: Behavioural proof against real Develocity
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # This plugin filters the Develocity build cache and nothing else, so the proof needs a live
    # instance. The server is whatever sample/settings.gradle.kts names; only the credentials come
    # from here. Add one repository secret:
    #   DEVELOCITY_ACCESS_KEY in the form the Develocity plugin expects: host=key
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v7

      # The Develocity plugin wants DEVELOCITY_ACCESS_KEY as `host=key`. Accept a bare key too
      # and pair it with the host the sample is configured for, since pasting the raw key from
      # ~/.gradle/develocity/keys.properties is the easy mistake and fails as a 401 much later.
      - name: Check and normalise the Develocity access key
        run: |
          [ -n "$DEVELOCITY_ACCESS_KEY" ] || {
            echo "::error::secret DEVELOCITY_ACCESS_KEY is not set"
            echo "Add it with: gh secret set DEVELOCITY_ACCESS_KEY -R ${{ github.repository }}"
            exit 1
          }

          SERVER=$(grep -o 'server = "[^"]*"' sample/settings.gradle.kts | sed -E 's/.*"(.*)"/\1/')
          HOST=$(printf '%s' "$SERVER" | sed -E 's#^https?://##; s#/.*##')
          echo "Sample is configured for $SERVER (host $HOST)"

          case "$DEVELOCITY_ACCESS_KEY" in
            *=*) echo "Access key already carries a host prefix" ;;
            *)
              echo "::add-mask::$HOST=$DEVELOCITY_ACCESS_KEY"
              echo "DEVELOCITY_ACCESS_KEY=$HOST=$DEVELOCITY_ACCESS_KEY" >> "$GITHUB_ENV"
              echo "Bare access key given; prefixed it with $HOST"
              ;;
          esac

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The offline tests run in the job above. This job covers what the test doubles cannot:
      # Develocity's own connector over the network, and AGP dex merging at full size.
      - name: Prove dex merging is declined against real Develocity
        run: |
          cd sample
          DEX=com.android.build.gradle.internal.tasks.DexMergingTask

          # The local tier lives in the Gradle user home and setup-gradle restores it between
          # runs. A warm local hit would satisfy dex merging without ever consulting the remote,
          # so there would be nothing for the filter to decline. Wipe it to force a real cold run.
          LOCAL="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/build-cache-1"
          rm -rf "$LOCAL" build app/build core/build domain/build

          # Passed explicitly, so this step checks the right type even if the default in
          # sample/gradle.properties changes.
          ../gradlew runAll --build-cache --console=plain \
            -PselectiveCache.excludedTypes="$DEX" 2>&1 | tee /tmp/cold.log

          grep -q "declined remote store for $DEX" /tmp/cold.log \
            || { echo "::error::no DexMergingTask store was declined"; exit 1; }
          grep -q "declined remote load for $DEX" /tmp/cold.log \
            || { echo "::error::no DexMergingTask load was declined"; exit 1; }

          # The filter must never touch the local tier: the entry we just declined to upload has
          # to be sitting in the local cache under the very same key.
          KEY=$(sed -n "s/.*declined remote store for $DEX .*(key \([0-9a-f]*\),.*/\1/p" /tmp/cold.log | head -1)
          [ -n "$KEY" ] \
            || { echo "::error::could not read a declined store key for $DEX out of the log"; exit 1; }
          [ -f "$LOCAL/$KEY" ] \
            || { echo "::error::$DEX entry $KEY is missing from $LOCAL; the filter leaked into the local tier"; exit 1; }

          echo "dex merging declined from Develocity; local cache still populated"

      # Excluding a type from the REMOTE tier must leave the LOCAL tier intact. That is the
      # property doNotCacheIf cannot express.
      - name: Prove the local tier still serves the excluded type
        run: |
          cd sample
          rm -rf build app/build core/build domain/build
          ../gradlew runAll --build-cache --console=plain \
            -PselectiveCache.excludedTypes=com.android.build.gradle.internal.tasks.DexMergingTask 2>&1 | tee /tmp/warm.log

          grep -qE '^> Task .*DexDebug FROM-CACHE' /tmp/warm.log \
            || { echo "::error::dex merging was not restored from the local cache"; exit 1; }

          echo "dex merging restored from the local tier despite being excluded from the remote"
