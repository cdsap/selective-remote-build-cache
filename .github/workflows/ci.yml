name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is an executable binary in the repo; confirm it is an
      # untampered official distribution before we run it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Pins the toolchain the same way the wrapper pins Gradle: if ./gradlew
      # ever resolves to something other than 9.7.1, fail loudly rather than
      # silently validating the wrong version.
      - name: Confirm pinned Gradle version
        run: |
          ACTUAL="$(./gradlew -p plugin --version | awk '/^Gradle/ {print $2}')"
          echo "Gradle reported: $ACTUAL"
          [ "$ACTUAL" = "9.7.1" ] || { echo "::error::expected Gradle 9.7.1, got $ACTUAL"; exit 1; }

      - name: Build and test the plugin
        run: ./gradlew -p plugin build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            plugin/build/reports/tests/
            plugin/build/test-results/
          retention-days: 7

  android:
    name: Behavioural proof on a real Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # verify.sh is an assertion, not a demo: each scenario greps for the
      # expected filtering output and the script runs under `set -o pipefail`,
      # so a missing line fails the job.
      - name: Behavioural proof (verify.sh)
        run: ./verify.sh

      # Independent of verify.sh's own greps: prove the excluded type really is
      # DexMergingTask and that the remote cache never received its entries.
      - name: Assert dex merging was declined
        run: |
          cd sample
          printf 'excludedTypes=com.android.build.gradle.internal.tasks.DexMergingTask\n' > filter.properties
          rm -rf .caches build a/build b/build c/build
          ../gradlew runAll --build-cache --console=plain 2>&1 | tee /tmp/build.log

          grep -q 'declined remote store for com.android.build.gradle.internal.tasks.DexMergingTask' /tmp/build.log \
            || { echo "::error::no DexMergingTask store was declined"; exit 1; }
          grep -q 'declined remote load for com.android.build.gradle.internal.tasks.DexMergingTask' /tmp/build.log \
            || { echo "::error::no DexMergingTask load was declined"; exit 1; }

          # The local tier must be untouched by the filter.
          test -d .caches/local && [ "$(find .caches/local -type f ! -name 'gc.properties' ! -name '*.lock' | wc -l)" -gt 0 ] \
            || { echo "::error::local cache is empty; the filter leaked into the local tier"; exit 1; }
          echo "dex merging declined from the remote cache; local cache still populated"
