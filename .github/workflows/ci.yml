name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # The wrapper jar is an executable binary in the repo; confirm it is an
      # untampered official distribution before we run it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Pins the toolchain the same way the wrapper pins Gradle: if ./gradlew
      # ever resolves to something other than 9.7.1, fail loudly rather than
      # silently validating the wrong version.
      - name: Confirm pinned Gradle version
        run: |
          ACTUAL="$(./gradlew -p plugin --version | awk '/^Gradle/ {print $2}')"
          echo "Gradle reported: $ACTUAL"
          [ "$ACTUAL" = "9.7.1" ] || { echo "::error::expected Gradle 9.7.1, got $ACTUAL"; exit 1; }

      - name: Build and test the plugin
        run: ./gradlew -p plugin build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            plugin/build/reports/tests/
            plugin/build/test-results/
          retention-days: 7

  android:
    name: Behavioural proof against real Develocity
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # This plugin filters the Develocity build cache and nothing else, so the proof needs a live
    # instance. Add two repository secrets:
    #   DEVELOCITY_URL        e.g. https://develocity.example.com
    #   DEVELOCITY_ACCESS_KEY in the form the Develocity plugin expects: host=key
    env:
      DEVELOCITY_SERVER: ${{ secrets.DEVELOCITY_URL }}
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Check Develocity credentials are present
        run: |
          missing=0
          [ -n "$DEVELOCITY_SERVER" ]    || { echo "::error::secret DEVELOCITY_URL is not set"; missing=1; }
          [ -n "$DEVELOCITY_ACCESS_KEY" ] || { echo "::error::secret DEVELOCITY_ACCESS_KEY is not set"; missing=1; }
          [ "$missing" -eq 0 ] || {
            echo "The Develocity proof cannot run without both secrets. See .github/workflows/ci.yml."
            exit 1
          }
          echo "Develocity server: $DEVELOCITY_SERVER"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The plugin's own 83 tests are the authority and run offline in the job above. This job
      # exists for the realism the test doubles cannot reach: Develocity's actual connector over
      # the network, and real AGP dex merging at real scale.
      - name: Prove dex merging is declined against real Develocity
        run: |
          cd sample
          DEX=com.android.build.gradle.internal.tasks.DexMergingTask
          rm -rf .caches build app/build core/build domain/build

          # Passed explicitly rather than relying on sample/gradle.properties, so this step
          # fails if the default there ever drifts away from what it claims to prove.
          ../gradlew runAll --build-cache --console=plain \
            -PselectiveCache.excludedTypes="$DEX" 2>&1 | tee /tmp/cold.log

          grep -q "declined remote store for $DEX" /tmp/cold.log \
            || { echo "::error::no DexMergingTask store was declined"; exit 1; }
          grep -q "declined remote load for $DEX" /tmp/cold.log \
            || { echo "::error::no DexMergingTask load was declined"; exit 1; }

          # The filter must never touch the local tier.
          [ "$(find .caches/local -type f ! -name 'gc.properties' ! -name '*.lock' | wc -l)" -gt 0 ] \
            || { echo "::error::local cache is empty; the filter leaked into the local tier"; exit 1; }

          echo "dex merging declined from Develocity; local cache still populated"

      # Excluding a type from the REMOTE tier must leave the LOCAL tier intact - the property
      # doNotCacheIf cannot express, and the reason this plugin exists.
      - name: Prove the local tier still serves the excluded type
        run: |
          cd sample
          rm -rf build app/build core/build domain/build
          ../gradlew runAll --build-cache --console=plain \
            -PselectiveCache.excludedTypes=com.android.build.gradle.internal.tasks.DexMergingTask 2>&1 | tee /tmp/warm.log

          grep -qE '^> Task .*DexDebug FROM-CACHE' /tmp/warm.log \
            || { echo "::error::dex merging was not restored from the local cache"; exit 1; }

          echo "dex merging restored from the local tier despite being excluded from the remote"
