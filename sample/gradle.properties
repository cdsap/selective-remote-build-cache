# Demo knobs, read in settings.gradle.kts. Override on the command line:
#
#   ../gradlew runAll --build-cache -PselectiveCache.maxStoreSizeBytes=100000
#
# Gradle properties rather than -D system properties: -D sticks to the daemon JVM for its whole
# lifetime and leaks between runs.

# Types that never use the REMOTE cache. Comma-separated, '*' wildcards allowed.
selectiveCache.excludedTypes=com.android.build.gradle.internal.tasks.DexMergingTask

# Skip remote stores above this size. 0 = no limit.
selectiveCache.maxStoreSizeBytes=0

# Local cache tier. Turn off to force the remote to be consulted.
selectiveCache.localEnabled=true
